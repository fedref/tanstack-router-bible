name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages v4+ 는 artifact ID 로 배포하므로 actions 읽기 권한이 필요하다.
  actions: read

# 동시 배포 1개만 유지
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 버전은 루트 package.json 의 packageManager 필드를 따른다.
      # (여기서 version 을 함께 지정하면 ERR_PNPM_BAD_PM_VERSION 로 충돌한다)
      - uses: pnpm/action-setup@v6

      # setup-node v6 부터 자동 캐싱은 npm 으로 제한됐다. pnpm 은 아래처럼 명시해야 한다.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # 배포 대상은 bible 뿐이므로 playground 의존성은 설치하지 않는다.
      - run: pnpm install --frozen-lockfile --filter bible...

      # vite.config 의 base 는 VITE_BASE 를 읽는다. 저장소 이름으로 /<repo>/ 를 넣는다.
      # (router-plugin 이 routeTree.gen.ts 를 생성하므로 tsc 없이 vite build 만 한다)
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm --filter bible exec vite build

      # SPA 딥링크 새로고침 대응(404 → index 로) + Jekyll 비활성화
      - name: SPA fallback & .nojekyll
        working-directory: apps/bible
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v6

      # v4 부터 dotfile 이 기본 제외된다. 위에서 만든 .nojekyll 을 살리려면 켜야 한다.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/bible/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
